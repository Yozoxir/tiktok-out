<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Ouvrir dans le navigateur</title>
  <style>
    :root{
      --bg:#0b0b0c;
      --fg:#ffffff;
      --muted:rgba(255,255,255,.65);
      --accent:#19c37d;
    }
    html,body{height:100%}
    body{
      margin:0;
      background:var(--bg);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      overflow:hidden;
    }

    .wrap{
      max-width:520px;
      padding:24px;
    }

    h1{
      font-size:26px;
      margin-bottom:42px;
      line-height:1.2;
      font-weight:800;
    }

    .step{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      font-size:18px;
      margin:22px 0;
    }

    .num{
      width:34px;height:34px;
      border:2px solid var(--fg);
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:800;
    }

    .green{
      color:var(--accent);
      font-weight:800;
    }

    /* Flèches animées vers le menu */
    .arrows{
      position:fixed;
      top:64px;
      right:18px;
      font-size:34px;
      animation:float 1s infinite;
      opacity:.9;
    }

    @keyframes float{
      0%{transform:translateY(0)}
      50%{transform:translateY(-10px)}
      100%{transform:translateY(0)}
    }

    .footer{
      position:fixed;
      bottom:18px;
      width:100%;
      font-size:12px;
      color:var(--muted);
      letter-spacing:.2px;
    }
  </style>
</head>
<body>

<div class="arrows">⬆️⬆️⬆️</div>

<div class="wrap">
  <h1>Pour accéder au lien,<br>suis ces étapes :</h1>

  <div class="step">
    <div class="num">1</div>
    <div>Clique sur <b>•••</b> en haut à droite</div>
  </div>

  <div class="step">
    <div class="num">2</div>
    <div>Puis <span class="green">Ouvrir dans le navigateur</span></div>
  </div>
</div>

<div class="footer">
  Ouvre dans Safari ou Chrome
</div>

<script>
  // 👉 Ton lien final
  const DEST = "https://antoressel.com";

  const ua = navigator.userAgent.toLowerCase();
  const isTikTok =
    ua.includes("tiktok") ||
    ua.includes("bytedance") ||
    ua.includes("musical.ly") ||
    ua.includes("aweme");

  // Si ce n'est PAS TikTok → redirection directe
  if(!isTikTok){
    location.replace(DEST);
  }
</script>

</body>
</html>
