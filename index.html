<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ouvrir dans le navigateur</title>

<style>
:root{
  --bg:#050505;
  --fg:#ffffff;

  /* position menu TikTok */
  --targetTop: calc(10px + env(safe-area-inset-top));
  --targetRight: calc(10px + env(safe-area-inset-right));
}

html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  overflow:hidden;
}

/* ===== FLÈCHES VERTICALES ===== */
.chevrons{
  position:fixed;
  top: calc(var(--targetTop) + 30px);
  right: calc(var(--targetRight) + 15px); /* DÉCALAGE 15px À GAUCHE */
  width:30px;
  height:120px;
  pointer-events:none;
}

/* flèche vers le haut */
.chev{
  position:absolute;
  left:50%;
  width:0;
  height:0;
  transform: translateX(-50%);
  
  border-left:7px solid transparent;
  border-right:7px solid transparent;
  border-bottom:10px solid white; /* pointe vers le haut */

  opacity:0;
  animation: slideUp 1.2s ease-in-out infinite;
}

/* 3 flèches empilées */
.chev:nth-child(1){ top:70px; animation-delay:0s; }
.chev:nth-child(2){ top:40px; animation-delay:.2s; }
.chev:nth-child(3){ top:10px; animation-delay:.4s; }

/* animation STRICTEMENT verticale */
@keyframes slideUp{
  0%{
    transform: translateX(-50%) translateY(20px);
    opacity:0;
  }
  30%{ opacity:1; }
  70%{ opacity:1; }
  100%{
    transform: translateX(-50%) translateY(-20px);
    opacity:0;
  }
}

/* ===== TEXTE AU CENTRE ===== */
.center{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:0 18px;
}

.card{
  width:min(520px,92vw);
}

h1{
  margin:0 0 18px;
  font-size:26px;
  font-weight:900;
}

.steps{
  display:grid;
  gap:14px;
}

.step{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  font-size:18px;
}

.num{
  width:32px;height:32px;
  border:2px solid #fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.action{
  font-weight:900;
  text-decoration:underline;
}

/* ===== BOUTON COPIER ===== */
.copyWrap{
  position:fixed;
  right: calc(14px + env(safe-area-inset-right));
  bottom: calc(14px + env(safe-area-inset-bottom));
}

.btn{
  border:0;
  border-radius:14px;
  padding:14px 16px;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
  background:#fff;
  color:#000;
}

.toast{
  position:fixed;
  bottom: calc(70px + env(safe-area-inset-bottom));
  right: calc(14px + env(safe-area-inset-right));
  background: rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
  padding:8px 12px;
  border-radius:12px;
  font-size:13px;
  display:none;
}
</style>
</head>

<body>

<!-- FLÈCHES -->
<div class="chevrons">
  <div class="chev"></div>
  <div class="chev"></div>
  <div class="chev"></div>
</div>

<!-- TEXTE -->
<div class="center">
  <div class="card">
    <h1>Ouvre dans le navigateur</h1>

    <div class="steps">
      <div class="step">
        <div class="num">1</div>
        <div>Clique sur <b>…</b> en haut à droite</div>
      </div>

      <div class="step">
        <div class="num">2</div>
        <div>Puis <span class="action">Ouvrir dans le navigateur</span></div>
      </div>
    </div>
  </div>
</div>

<!-- BOUTON -->
<div class="copyWrap">
  <button class="btn" id="copyBtn">Copier le lien</button>
</div>

<div class="toast" id="toast">Lien copié ✅</div>

<script>
const DEST = "https://antoressel.com";

async function copyText(text){
  const ta=document.createElement("textarea");
  ta.value=text;
  ta.style.position="fixed";
  ta.style.top="-9999px";
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  document.body.removeChild(ta);
}

const toast=document.getElementById("toast");
document.getElementById("copyBtn").addEventListener("click",async()=>{
  await copyText(DEST);
  toast.style.display="block";
  setTimeout(()=>toast.style.display="none",1200);
});
</script>

</body>
</html>
