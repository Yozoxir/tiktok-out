<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ouvrir dans le navigateur</title>

<style>
:root{
  --bg:#050505;
  --fg:#ffffff;

  /* position du menu TikTok */
  --targetTop: calc(10px + env(safe-area-inset-top));
  --targetRight: calc(10px + env(safe-area-inset-right));
}

html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  overflow:hidden;
}

/* ===== FLÈCHE UNIQUE AGRANDIE ===== */
.chevrons{
  position:fixed;
  top: calc(var(--targetTop) + 20px);
  right: calc(var(--targetRight) + 1px); /* 1px à gauche */
  width:60px;
  height:220px;
  pointer-events:none;
}

.chev{
  position:absolute;
  left:50%;
  transform: translateX(-50%);
  width:10px;          /* PLUS LARGE */
  height:50px;         /* PLUS LONG */
  background:white;    /* corps de la flèche */
  animation: loopDown 1.4s ease-in-out infinite;
}

/* pointe */
.chev::after{
  content:"";
  position:absolute;
  bottom:100%;
  left:50%;
  transform:translateX(-50%);
  border-left:22px solid transparent;
  border-right:22px solid transparent;
  border-bottom:28px solid white; /* PLUS GRANDE */
}

/* ANIMATION HAUT → BAS EN BOUCLE */
@keyframes loopDown{
  0%{
    transform:translateX(-50%) translateY(0);
    opacity:0;
  }
  15%{ opacity:1; }
  85%{ opacity:1; }
  100%{
    transform:translateX(-50%) translateY(140px);
    opacity:0;
  }
}

/* ===== TEXTE CENTRÉ ===== */
.center{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:0 18px;
}

.card{ width:min(520px,92vw); }

h1{
  margin:0 0 18px;
  font-size:26px;
  font-weight:900;
}

.steps{ display:grid; gap:14px; }

.step{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  font-size:18px;
}

.num{
  width:32px;height:32px;
  border:2px solid #fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.action{ font-weight:900; text-decoration:underline; }

/* ===== BOUTON COPIER ===== */
.copyWrap{
  position:fixed;
  right: calc(14px + env(safe-area-inset-right));
  bottom: calc(14px + env(safe-area-inset-bottom));
}

.btn{
  border:0;
  border-radius:14px;
  padding:14px 16px;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
  background:#fff;
  color:#000;
}

.toast{
  position:fixed;
  bottom: calc(70px + env(safe-area-inset-bottom));
  right: calc(14px + env(safe-area-inset-right));
  background: rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.2);
  padding:8px 12px;
  border-radius:12px;
  font-size:13px;
  display:none;
}
</style>
</head>

<body>

<!-- FLÈCHE UNIQUE -->
<div class="chevrons">
  <div class="chev"></div>
</div>

<!-- TEXTE -->
<div class="center">
  <div class="card">
    <h1>Ouvre dans le navigateur</h1>
    <div class="steps">
      <div class="step">
        <div class="num">1</div>
        <div>Clique sur <b>…</b> en haut à droite</div>
      </div>
      <div class="step">
        <div class="num">2</div>
        <div>Puis <span class="action">Ouvrir dans le navigateur</span></div>
      </div>
    </div>
  </div>
</div>

<!-- BOUTON -->
<div class="copyWrap">
  <button class="btn" id="copyBtn">Copier le lien</button>
</div>

<div class="toast" id="toast">Lien copié ✅</div>

<script>
const DEST = "https://antoressel.com";

/* Détection TikTok IN-APP */
const ua = navigator.userAgent.toLowerCase();
const isTikTok =
  ua.includes("tiktok") ||
  ua.includes("bytedance") ||
  ua.includes("musical.ly") ||
  ua.includes("aweme") ||
  ua.includes("ttwebview");

/* Redirection uniquement hors TikTok */
if(!isTikTok){
  window.location.replace(DEST);
}

/* Copier lien */
async function copyText(text){
  try{
    if(navigator.clipboard){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  const ta=document.createElement("textarea");
  ta.value=text;
  ta.style.position="fixed";
  ta.style.top="-9999px";
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  document.body.removeChild(ta);
}

const toast=document.getElementById("toast");
document.getElementById("copyBtn").addEventListener("click",async()=>{
  await copyText(DEST);
  toast.style.display="block";
  setTimeout(()=>toast.style.display="none",1200);
});
</script>

</body>
</html>
