<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ouvrir dans le navigateur</title>

<style>
:root{
  --bg:#050505;
  --fg:#ffffff;
  --muted:rgba(255,255,255,.70);
  --muted2:rgba(255,255,255,.55);

  /* Position menu TikTok (coin haut droit) */
  --targetTop: calc(10px + env(safe-area-inset-top));
  --targetRight: calc(10px + env(safe-area-inset-right));
}

html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  overflow:hidden;
}

/* Glow premium discret */
.bgGlow{
  position:fixed; inset:-40%;
  background:
    radial-gradient(circle at 90% 10%, rgba(255,255,255,.12), transparent 42%),
    radial-gradient(circle at 50% 70%, rgba(255,255,255,.06), transparent 55%);
  pointer-events:none;
}

/* Focus coin haut droit */
.spotlight{
  position:fixed; inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at calc(100% - 32px) calc(0% + 48px),
      rgba(255,255,255,.20),
      rgba(0,0,0,0) 58%);
  animation: spot 1.35s ease-in-out infinite;
  mix-blend-mode: screen;
  opacity:.95;
}
@keyframes spot{
  0%,100%{opacity:.65}
  50%{opacity:1}
}

/* Cadre subtil autour du coin (aide l’œil) */
.cornerFrame{
  position:fixed;
  top: var(--targetTop);
  right: var(--targetRight);
  width:88px;
  height:66px;
  border-radius:18px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.03);
  pointer-events:none;
  animation: frame 2.2s ease-in-out infinite;
}
@keyframes frame{
  0%,88%,100%{transform:translate(0,0); opacity:.9}
  90%{transform:translate(-2px,2px); opacity:1}
  92%{transform:translate(2px,-2px); opacity:1}
  94%{transform:translate(-2px,1px); opacity:1}
  96%{transform:translate(1px,-1px); opacity:1}
}

/* ===== CHEVRONS (flèches) ===== */
.chevrons{
  position:fixed;

  /* PLUS EN HAUT qu’avant */
  top: calc(var(--targetTop) + 36px);
  right: calc(var(--targetRight) - 10px);

  width:70px;
  height:160px;
  pointer-events:none;
  filter: drop-shadow(0 14px 28px rgba(0,0,0,.65));
}

/* Chevron = forme ^ (orienté vers le haut) */
.chev{
  position:absolute;
  left:50%;
  width:30px;
  height:30px;

  /* VERS LE HAUT */
  transform: translateX(-50%) rotate(-45deg);

  border-top: 5px solid #fff;
  border-right: 5px solid #fff;

  opacity:0;
  will-change: transform, opacity, filter;
  animation: popUp 1.05s cubic-bezier(.16,.84,.24,1) infinite;
}

/* Empilement des 3 chevrons (comme ^^^) */
.chev:nth-child(1){ top:106px; animation-delay:0s; }
.chev:nth-child(2){ top:66px;  animation-delay:.12s; }
.chev:nth-child(3){ top:26px;  animation-delay:.24s; }

/* NOUVELLE ANIMATION :
   - “pop” (scale) + montée vers le haut
   - petite lueur au pic
*/
@keyframes popUp{
  0%{
    transform:translateX(-50%) rotate(-45deg) translateY(22px) scale(.75);
    opacity:0;
    filter:blur(.6px);
  }
  18%{
    opacity:1;
  }
  45%{
    transform:translateX(-50%) rotate(-45deg) translateY(0px) scale(1.08);
    opacity:1;
    filter:blur(0px) drop-shadow(0 0 10px rgba(255,255,255,.30));
  }
  75%{
    transform:translateX(-50%) rotate(-45deg) translateY(-14px) scale(1.02);
    opacity:.85;
  }
  100%{
    transform:translateX(-50%) rotate(-45deg) translateY(-30px) scale(1.00);
    opacity:0;
    filter:blur(1px);
  }
}

/* ===== TEXTE AU MILIEU ===== */
.center{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;   /* centre vertical */
  justify-content:center;
  text-align:center;
  padding:0 18px;
  pointer-events:none; /* laisse cliquer le bouton */
}

.card{
  width:min(560px, 92vw);
}

h1{
  margin:0 0 18px;
  font-size:28px;
  font-weight:900;
  letter-spacing:.2px;
  line-height:1.1;
}

.steps{
  display:grid;
  gap:14px;
  margin:0 auto;
  max-width:520px;
}

.step{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  font-size:18px;
}

.num{
  width:34px;height:34px;
  border:2px solid #fff;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
  flex:0 0 auto;
}

.action{
  font-weight:900;
  text-decoration:underline;
  text-underline-offset:4px;
}

.sub{
  margin-top:14px;
  font-size:12px;
  color:var(--muted2);
}

/* ===== BOUTON COPIER EN BAS À DROITE ===== */
.copyWrap{
  position:fixed;
  right: calc(14px + env(safe-area-inset-right));
  bottom: calc(14px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  align-items:flex-end;
  gap:10px;
  z-index:5;
}

.btn{
  border:0;
  border-radius:14px;
  padding:14px 16px;
  font-size:15px;
  font-weight:900;
  cursor:pointer;
  background:#fff;
  color:#000;
  box-shadow: 0 10px 30px rgba(0,0,0,.45);
}
.btn:active{ transform: translateY(1px); }

.toast{
  background: rgba(255,255,255,.10);
  border: 1px solid rgba(255,255,255,.16);
  padding:10px 12px;
  border-radius:14px;
  font-size:13px;
  color:#fff;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display:none;
}

/* Footer optionnel (tu peux supprimer si tu veux) */
.footer{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  color:var(--muted);
  letter-spacing:.2px;
  pointer-events:none;
  opacity:.9;
}
</style>
</head>

<body>
  <div class="bgGlow"></div>
  <div class="spotlight"></div>

  <div class="cornerFrame" aria-hidden="true"></div>

  <div class="chevrons" aria-hidden="true">
    <div class="chev"></div>
    <div class="chev"></div>
    <div class="chev"></div>
  </div>

  <!-- TEXTE AU MILIEU -->
  <div class="center">
    <div class="card">
      <h1>Ouvre dans le navigateur</h1>

      <div class="steps">
        <div class="step">
          <div class="num">1</div>
          <div>Clique sur <b>…</b> en haut à droite</div>
        </div>

        <div class="step">
          <div class="num">2</div>
          <div>Puis <span class="action">Ouvrir dans le navigateur</span></div>
        </div>
      </div>

      <div class="sub">Si ça bloque, copie le lien et colle-le dans Safari / Chrome</div>
    </div>
  </div>

  <!-- BOUTON COPIER EN BAS À DROITE -->
  <div class="copyWrap">
    <div class="toast" id="toast">Lien copié ✅</div>
    <button class="btn" id="copyBtn" type="button">Copier le lien</button>
  </div>

  <div class="footer">Safari ou Chrome</div>

<script>
  // 🔧 Mets ton lien final ici
  const DEST = "https://antoressel.com";

  async function copyText(text){
    try{
      if(navigator.clipboard && window.isSecureContext){
        await navigator.clipboard.writeText(text);
        return true;
      }
    }catch(e){}

    try{
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly","");
      ta.style.position="fixed";
      ta.style.top="-9999px";
      document.body.appendChild(ta);
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    }catch(e){
      return false;
    }
  }

  const toast = document.getElementById("toast");
  function showToast(msg){
    toast.textContent = msg;
    toast.style.display = "block";
    clearTimeout(window.__t);
    window.__t = setTimeout(()=> toast.style.display="none", 1400);
  }

  document.getElementById("copyBtn").addEventListener("click", async ()=>{
    const ok = await copyText(DEST);
    showToast(ok ? "Lien copié ✅" : "Copie impossible ❌");
  });

  // ✅ Aucune redirection volontaire (page guide uniquement)
</script>
</body>
</html>
