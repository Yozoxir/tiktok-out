<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ouvrir dans le navigateur</title>

<style>
:root{
  --bg:#050505;
  --fg:#ffffff;
  --muted:rgba(255,255,255,.62);

  /* position du menu TikTok */
  --targetTop: calc(10px + env(safe-area-inset-top));
  --targetRight: calc(10px + env(safe-area-inset-right));
}

html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(circle at 86% 10%, rgba(255,255,255,.10), transparent 42%),
    radial-gradient(circle at 40% 70%, rgba(255,255,255,.05), transparent 55%),
    var(--bg);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  overflow:hidden;
}

/* Spotlight discret vers le coin */
.spotlight{
  position:fixed; inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at calc(100% - 34px) calc(0% + 54px),
      rgba(255,255,255,.14),
      rgba(0,0,0,0) 58%);
  animation: spot 1.6s ease-in-out infinite;
}
@keyframes spot{
  0%,100%{opacity:.55}
  50%{opacity:1}
}

/* ===== GROUPE FLÈCHES (3) ===== */
.chevrons{
  position:fixed;
  top: calc(var(--targetTop) + 18px);
  right: calc(var(--targetRight) - 8px); /* +5px vers la droite (était -3px) */
  width:72px;
  height:210px;
  pointer-events:none;
  filter: drop-shadow(0 10px 22px rgba(0,0,0,.65));
}

/* Une flèche = corps + pointe */
.chev{
  position:absolute;
  left:50%;
  transform: translateX(-50%);
  width:6px;
  height:30px;
  background:#fff;
  border-radius:999px;
  animation: upDown 1.35s ease-in-out infinite alternate;
}

/* Pointe */
.chev::after{
  content:"";
  position:absolute;
  bottom:100%;
  left:50%;
  transform:translateX(-50%);
  border-left:14px solid transparent;
  border-right:14px solid transparent;
  border-bottom:18px solid #fff;
}

/* 3 flèches empilées */
.chev:nth-child(1){ top:128px; animation-delay:0s; }
.chev:nth-child(2){ top:78px;  animation-delay:.12s; }
.chev:nth-child(3){ top:28px;  animation-delay:.24s; }

/* Mouvement haut ↔ bas continu */
@keyframes upDown{
  from{ transform:translateX(-50%) translateY(0); }
  to  { transform:translateX(-50%) translateY(72px); }
}

/* ===== TEXTE CENTRÉ ===== */
.center{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:0 18px;
}

.card{
  width:min(560px,92vw);
  padding:22px 18px;
  border-radius:18px;
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.10);
}

h1{
  margin:0 0 18px;
  font-size:26px;
  font-weight:900;
}

.steps{
  display:grid;
  gap:12px;
}

.step{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  font-size:18px;
}

.num{
  width:34px;height:34px;
  border:2px solid #fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.action{
  font-weight:900;
  text-decoration:underline;
}

/* ===== BOUTON COPIER (bas centré) ===== */
.copyWrap{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom: calc(52px + env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:8px;
}

.btn{
  border:0;
  border-radius:14px;
  padding:12px 20px;
  font-size:14px;
  font-weight:900;
  cursor:pointer;
  background:#fff;
  color:#000;
  box-shadow: 0 10px 28px rgba(0,0,0,.45);
}

.toast{
  background: rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.16);
  padding:8px 12px;
  border-radius:12px;
  font-size:12px;
  display:none;
}

/* ===== FOOTER ===== */
.footer{
  position:fixed;
  left:50%;
  transform:translateX(-50%);
  bottom: calc(10px + env(safe-area-inset-bottom));
  text-align:center;
  font-size:12px;
  color:var(--muted);
  line-height:1.35;
}
</style>
</head>

<body>
<div class="spotlight"></div>

<!-- 3 flèches -->
<div class="chevrons">
  <div class="chev"></div>
  <div class="chev"></div>
  <div class="chev"></div>
</div>

<!-- Texte -->
<div class="center">
  <div class="card">
    <h1>Ouvre dans le navigateur</h1>
    <div class="steps">
      <div class="step">
        <div class="num">1</div>
        <div>Clique sur <b>…</b> en haut à droite</div>
      </div>
      <div class="step">
        <div class="num">2</div>
        <div>Puis <span class="action">Ouvrir dans le navigateur</span></div>
      </div>
    </div>
  </div>
</div>

<!-- Copier lien -->
<div class="copyWrap">
  <div class="toast" id="toast">Lien copié ✅</div>
  <button class="btn" id="copyBtn">Copier le lien</button>
</div>

<!-- Footer -->
<div class="footer">
  Safari ou Chrome<br>
  Un site fais par antoressel
</div>

<script>
const DEST = "https://antoressel.com";

/* Détection TikTok IN-APP */
const ua = navigator.userAgent.toLowerCase();
const isTikTok =
  ua.includes("tiktok") ||
  ua.includes("bytedance") ||
  ua.includes("musical.ly") ||
  ua.includes("aweme") ||
  ua.includes("ttwebview");

/* Redirection uniquement hors TikTok */
if(!isTikTok){
  window.location.replace(DEST);
}

/* Copier lien */
async function copyText(text){
  try{
    if(navigator.clipboard){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  const ta=document.createElement("textarea");
  ta.value=text;
  ta.style.position="fixed";
  ta.style.top="-9999px";
  document.body.appendChild(ta);
  ta.select();
  document.execCommand("copy");
  document.body.removeChild(ta);
  return true;
}

const toast=document.getElementById("toast");
document.getElementById("copyBtn").addEventListener("click",async()=>{
  await copyText(DEST);
  toast.style.display="block";
  setTimeout(()=>toast.style.display="none",1200);
});
</script>

</body>
</html>
