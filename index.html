<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ouvrir dans le navigateur</title>
<style>
:root{
  --bg:#060606;
  --fg:#ffffff;
  --muted:rgba(255,255,255,.65);

  /* Position du menu TikTok */
  --targetTop: calc(10px + env(safe-area-inset-top));
  --targetRight: calc(10px + env(safe-area-inset-right));
}

html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--fg);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  overflow:hidden;
  text-align:center;
}

/* halo discret vers le coin */
.spotlight{
  position:fixed; inset:0;
  pointer-events:none;
  background:
    radial-gradient(circle at calc(100% - 32px) calc(0% + 48px),
      rgba(255,255,255,.18),
      rgba(0,0,0,0) 55%);
  animation: glow 1.4s ease-in-out infinite;
}
@keyframes glow{
  0%,100%{opacity:.6}
  50%{opacity:1}
}

/* ===== CHEVRONS ===== */
.chevrons{
  position:fixed;
  top: calc(var(--targetTop) + 64px);
  right: calc(var(--targetRight) - 6px); /* PLUS À DROITE */
  width:60px;
  height:140px;
  pointer-events:none;
}

.chev{
  position:absolute;
  left:50%;
  width:28px;
  height:28px;
  transform:translateX(-50%) rotate(-45deg); /* vers le HAUT */
  border-top:4px solid #fff;
  border-right:4px solid #fff;
  opacity:0;
  animation: rise 1.2s infinite;
}

.chev:nth-child(1){ top:90px; animation-delay:0s; }
.chev:nth-child(2){ top:55px; animation-delay:.15s; }
.chev:nth-child(3){ top:20px; animation-delay:.3s; }

@keyframes rise{
  0%   { transform:translateX(-50%) rotate(-45deg) translateY(18px); opacity:0; }
  30%  { opacity:1; }
  70%  { transform:translateX(-50%) rotate(-45deg) translateY(-10px); opacity:.8; }
  100% { transform:translateX(-50%) rotate(-45deg) translateY(-26px); opacity:0; }
}

/* ===== TEXTE ===== */
.wrap{
  position:absolute;
  bottom:80px;
  left:0; right:0;
  padding:0 20px;
}

h1{
  font-size:24px;
  margin-bottom:28px;
  font-weight:800;
}

.step{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  font-size:18px;
  margin:18px 0;
}

.num{
  width:32px;height:32px;
  border:2px solid #fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.action{
  font-weight:900;
  text-decoration:underline;
}

/* TEXTE DU BAS CENTRÉ */
.footer{
  position:fixed;
  bottom:18px;
  left:50%;
  transform:translateX(-50%);
  width:auto;
  text-align:center;
  font-size:12px;
  color:var(--muted);
}
</style>
</head>

<body>

<div class="spotlight"></div>

<div class="chevrons">
  <div class="chev"></div>
  <div class="chev"></div>
  <div class="chev"></div>
</div>

<div class="wrap">
  <h1>Pour accéder au lien</h1>

  <div class="step">
    <div class="num">1</div>
    <div>Clique sur <b>…</b> en haut à droite</div>
  </div>

  <div class="step">
    <div class="num">2</div>
    <div>Puis <span class="action">Ouvrir dans le navigateur</span></div>
  </div>
</div>

<div class="footer">
  Safari ou Chrome
</div>

</body>
</html>
