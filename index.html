<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Ouvrir dans le navigateur</title>
  <style>
    :root{
      --bg:#050506;
      --fg:#ffffff;
      --muted:rgba(255,255,255,.6);
      --accent:#3cffc6;   /* couleur d’action */
      --accent2:#6af3ff;  /* glow léger */
    }

    html,body{height:100%}
    body{
      margin:0;
      background:
        radial-gradient(circle at top right, rgba(60,255,198,.15), transparent 40%),
        var(--bg);
      color:var(--fg);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      overflow:hidden;
    }

    .wrap{
      max-width:520px;
      padding:26px;
    }

    h1{
      font-size:26px;
      margin-bottom:42px;
      line-height:1.2;
      font-weight:900;
      letter-spacing:.3px;
    }

    .step{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      font-size:18px;
      margin:22px 0;
    }

    .num{
      width:36px;height:36px;
      border:2px solid var(--accent);
      border-radius:50%;
      display:flex;
      align-items:center;
      justify-content:center;
      font-weight:900;
      color:var(--accent);
      box-shadow:0 0 12px rgba(60,255,198,.35);
    }

    .action{
      color:var(--accent);
      font-weight:900;
      text-shadow:0 0 8px rgba(60,255,198,.5);
    }

    /* Flèches animées */
    .arrows{
      position:fixed;
      top:64px;
      right:18px;
      font-size:36px;
      color:var(--accent);
      animation:float 1s infinite;
      text-shadow:0 0 12px rgba(60,255,198,.7);
    }

    @keyframes float{
      0%{transform:translateY(0)}
      50%{transform:translateY(-12px)}
      100%{transform:translateY(0)}
    }

    .footer{
      position:fixed;
      bottom:18px;
      width:100%;
      font-size:12px;
      color:var(--muted);
      letter-spacing:.3px;
    }
  </style>
</head>
<body>

<div class="arrows">⬆️⬆️⬆️</div>

<div class="wrap">
  <h1>Pour accéder au lien</h1>

  <div class="step">
    <div class="num">1</div>
    <div>Clique sur <b>•••</b> en haut à droite</div>
  </div>

  <div class="step">
    <div class="num">2</div>
    <div>Puis <span class="action">Ouvrir dans le navigateur</span></div>
  </div>
</div>

<div class="footer">
  Ouvre dans Safari ou Chrome
</div>

<script>
  const DEST = "https://antoressel.com";

  const ua = navigator.userAgent.toLowerCase();
  const isTikTok =
    ua.includes("tiktok") ||
    ua.includes("bytedance") ||
    ua.includes("musical.ly") ||
    ua.includes("aweme");

  if(!isTikTok){
    location.replace(DEST);
  }
</script>

</body>
</html>
